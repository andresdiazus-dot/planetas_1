<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báscula cósmica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="pagina" id="inicio">

    <nav class="navbar">
      <a href="#inicio" class="marca">
        <img id="logo" src="logo.png" alt="Logo de Báscula Cósmica">
        <span>Báscula Cósmica</span>
      </a>

      <ul class="menu">
        <li><a href="#inicio" data-i18n="nav_inicio">Inicio</a></li>
        <li><a href="#lectura" data-i18n="nav_peso">Mi peso</a></li>
        <li><a href="#mundos" data-i18n="nav_mundos">Los mundos</a></li>

        <li class="idioma">
          <button type="button" id="idioma-btn" class="idioma-btn"
                  aria-haspopup="true" aria-expanded="false" aria-controls="idioma-menu">
            <span data-i18n="idioma">Idioma</span> ▾
          </button>
          <ul id="idioma-menu" class="idioma-menu" hidden>
            <li><button type="button" data-lang="es">Español</button></li>
            <li><button type="button" data-lang="en">English</button></li>
          </ul>
        </li>
      </ul>
    </nav>

    <div class="entrada">
      <label for="peso" data-i18n="label_peso">Si en la Tierra pesas</label>
      <div class="campo">
        <input id="peso" type="number" inputmode="decimal" value="70" min="1" step="0.1">
        <span>kg</span>
      </div>
    </div>

    <section class="lectura" id="lectura" aria-live="polite">
      <div class="resultado-planeta">

        <div class="resultado-texto">
          <p class="frase">
            <span data-i18n="frase_pre">En</span>
            <strong id="nombre">Marte</strong>
            <span data-i18n="frase_post">marcarías</span>
          </p>
          <p class="cifra">
            <span id="resultado">26,5</span><small>kg</small>
          </p>
          <p class="detalle" id="detalle">
            43,5 kg menos que en la Tierra · gravedad de 3,71 m/s²
          </p>
        </div>

        <div class="planeta-escena marte" id="planeta-escena" role="img" aria-label="Marte animado">
          <div class="planeta-globo"></div>
        </div>

      </div>
    </section>

    <section class="mundos" id="mundos">
      <h2 data-i18n="mundos_titulo">Compara todos los mundos</h2>
      <ul id="lista" class="lista"></ul>
    </section>

    <p class="nota" data-i18n="nota">
      Cálculo: peso en el mundo = tu peso en la Tierra × (gravedad del mundo ÷ 9,81).
    </p>

  </main>

  <script src="script.js"></script>
</body>
</html>
